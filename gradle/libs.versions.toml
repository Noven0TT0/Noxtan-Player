[versions]
agp = "9.1.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
koin = "4.2.2"
room = "2.8.4"
detekt = "1.23.8"
about-libs = "12.2.4"
navigation3 = "1.1.4"
kotlinx-serialization = "1.11.0"
foundationLayout = "1.11.4"

appcompat = "1.7.1"
preference-ktx = "1.2.1"
media = "1.8.0"
documentfile = "1.1.0"
mpv-lib = "0.1.9"
seeker = "2.0.1"
material = "1.14.0"
compose-prefs = "2.2.0"
detekt-compose = "0.6.3"
immutable-collections = "0.5.1"
fsaf = "1.1.3"
simple-icons = "1.1.1"
ksp = "2.3.9"
coil = "3.5.0"
constraintlayout = "1.1.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
saveable = { group = "androidx.compose.runtime", name = "runtime-saveable" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3-android = { group = "androidx.compose.material3", name = "material3" }
androidx-material3-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintlayout" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-startup = { module = "io.insert-koin:koin-androidx-startup" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-formatter = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
about-libs-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "about-libs" }
about-libs-ui-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "about-libs" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-preferences-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference-ktx" }
mediasession = { module = "androidx.media:media", version.ref = "media" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
mpv-lib = { module = "io.github.abdallahmehiz:mpv-android-lib", version.ref = "mpv-lib" }
seeker = { module = "com.github.abdallahmehiz:seeker", version.ref = "seeker" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
compose-prefs = { module = "me.zhanghai.compose.preference:preference", version.ref = "compose-prefs" }
detekt-rules-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "detekt-compose" }
kotlinx-immutable-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "immutable-collections" }
fsaf = { module = "com.github.K1rakishou:Fuck-Storage-Access-Framework", version.ref = "fsaf" }
simple-icons = { module = "br.com.devsrsouza.compose.icons:simple-icons", version.ref = "simple-icons" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

[bundles]
koin = ["koin-core", "koin-android", "koin-compose", "koin-viewmodel", "koin-startup"]
about-libs = ["about-libs-core", "about-libs-ui-m3"]
compose-navigation3 = ["androidx-navigation3-runtime", "androidx-navigation3-ui"]

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
about-libraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "about-libs" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }